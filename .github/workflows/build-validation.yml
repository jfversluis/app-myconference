name: build

on:
  push:
    branches: [ main ]
    paths:
    - '**.cs'
    - '**.csproj'
    - '**.xaml'
    - '**.yml'
    - '!**.md'
    - '!.gitignore'
  pull_request:
    branches: [ main ]
    paths:
    - '**.cs'
    - '**.csproj'
    - '**.xaml'
    - '**.yml'
    - '!**.md'
    - '!.gitignore'

env:
  DOTNET_VERSION: '10.0.x' # .NET 10 preview

jobs:
  build:

    name: Build All Projects
    runs-on: windows-latest
        
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        dotnet-quality: 'preview'
        
    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v2
      with:
        vs-prerelease: true
    
    - name: Install .NET workloads
      shell: pwsh
      run: |
        dotnet workload install android
        dotnet workload install ios
        dotnet workload install maui
      
    - name: Build .NET MAUI Conference App
      run: |
        dotnet build src/Conference.Maui/Conference.Maui.csproj -f net10.0-android
        dotnet build src/Conference.Maui/Conference.Maui.csproj -f net10.0-ios